name: 'Build'

on:
  push:
  pull_request:

jobs:
  build:
    name: Test build
    runs-on: ubuntu-latest
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install Yarn 4
        run: npm install -g yarn@4.12.0

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn build